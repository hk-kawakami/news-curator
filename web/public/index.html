<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F6F3">
<title>ニュース</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <nav class="chips" id="chips" aria-label="分野で絞り込み"></nav>
  <main id="main" class="main" aria-live="polite"></main>
  <nav class="tabs" aria-label="メインメニュー">
    <a href="#today" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>今日</a>
    <a href="#later" data-tab="later">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>あとで読む</a>
    <a href="#favorite" data-tab="favorite">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-6-4-6 4z"/></svg>お気に入り</a>
    <a href="#rated" data-tab="rated">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg>評価済み</a>
    <a href="#settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>設定</a>
  </nav>
</div>

<div class="sheet-backdrop" id="sheet" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="grip"></div>
    <p class="sheet-meta" id="sheet-meta"></p>
    <h2 id="sheet-title"></h2>
    <a class="sheet-row" id="sheet-open" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>元記事を開く</a>
    <button type="button" class="sheet-row" id="sheet-mute-source">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l16 16M10.6 6.1A9 9 0 0 1 21 12a10 10 0 0 1-2.2 3M6.2 6.6A10 10 0 0 0 3 12s3 6 9 6a8.6 8.6 0 0 0 3.6-.8"/></svg><span></span></button>
    <div class="sheet-block" id="sheet-tags-block">
      <p class="sheet-label">キーワードを非表示</p>
      <p class="sheet-note">タップしたキーワードを含む記事は一覧に出なくなります</p>
      <div class="tag-row" id="sheet-tags"></div>
    </div>
    <button type="button" class="sheet-close" id="sheet-close">閉じる</button>
  </section>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<script src="/app.js"></script>
</body>
</html>
