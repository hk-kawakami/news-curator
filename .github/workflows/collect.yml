name: ニュース収集

on:
  schedule:
    # GitHub Actions の時刻は UTC。混雑時は数分〜数十分遅れることがある
    - cron: "0 21 * * *"   # 毎朝 6:00（日本時間）
    - cron: "0 9 * * *"    # 毎夕 18:00（日本時間）
  workflow_dispatch:        # Actions 画面から手動実行

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: ローカルテスト
        run: |
          python tests/test_collect.py
          python tests/test_summarize.py

      - name: RSSを収集してD1に保存
        run: python batch/collect.py

      - name: Geminiで要約・分類
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # モデルを変えたいときは Settings → Secrets and variables → Actions → Variables に
          # GEMINI_MODELS（例: gemini-3.5-flash-lite,gemini-3.8-flash）を登録する
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
        run: python batch/summarize.py
